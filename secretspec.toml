ENDOREG_DB_PLAINTEXT_TMP_DIR = { default = "/var/endoreg-service-user/lx-ai/data/temp/plaintext_media", description = "Temporary plaintext media directory." }

LX_ANNOTATE_STREAMABLE_VIDEO_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos", description = "Root directory for streamable videos." }
LX_ANNOTATE_STREAMABLE_VIDEO_RAW_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos/raw", description = "Raw streamable video directory." }
LX_ANNOTATE_STREAMABLE_VIDEO_PROCESSED_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos/processed", description = "Processed streamable video directory." }

LOG_LEVEL = { default = "INFO", description = "Application logging level." }
