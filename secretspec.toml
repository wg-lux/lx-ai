# =============================================================================
# Production profile
# Used by lx-ai production/service execution.
#
# Important design:
# - lx-ai writes generated frames, checkpoints, runs, and temp plaintext files
#   under /var/endoreg-service-user/lx-ai/data.
# - endoreg-db resolves protected media/videos under lx-annotate storage:
#   /var/lib/lx-annotate/data/storage.
#
# Therefore:
# - DATA_DIR remains lx-ai-owned.
# - LX_ANNOTATE_ENCRYPTED_DATA_DIR points to lx-annotate protected data root.
# - STORAGE_DIR and PROTECTED_MEDIA_ROOT point to lx-annotate protected storage.
# =============================================================================

[profiles.production]
HOME_DIR = { default = "/var/endoreg-service-user" }
WORKING_DIR = { default = "/var/endoreg-service-user/lx-ai" }

DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data" }
DJANGO_DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data" }
LX_ANNOTATE_DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data" }
LX_ANNOTATE_ENCRYPTED_DATA_DIR = { default = "/var/lib/lx-annotate/data" }

CONF_DIR = { default = "/var/endoreg-service-user/lx-ai/conf" }

STORAGE_DIR = { default = "/var/lib/lx-annotate/data/storage" }
PROTECTED_MEDIA_ROOT = { default = "/var/lib/lx-annotate/data/storage" }

FRAME_DIR = { default = "/var/endoreg-service-user/lx-ai/data/frames" }
FRAME_MATERIALIZATION_OUTPUT_ROOT = { default = "/var/endoreg-service-user/lx-ai/data/frames/generated" }

TRAINING_CONFIG_PATH = { default = "/var/endoreg-service-user/lx-ai/lx_ai/ai_model_config/train_sandbox_postgres.yaml" }

TRAINING_ROOT = { default = "/var/endoreg-service-user/lx-ai/data/model_training" }
CHECKPOINTS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints" }
RUNS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/runs" }
BUCKET_SNAPSHOT_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/buckets" }

BACKBONE_CHECKPOINT = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints/RN50_GastroNet-1M_DINOv1.pth" }
BACKBONE_CHECKPOINT_URL = { default = "" }

SQLITE_DB_PATH = { default = "/var/endoreg-service-user/lx-ai/dev_db.sqlite" }

LEGACY_IMAGE_DIR = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/images" }
LEGACY_JSONL_PATH = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/legacy_img_dicts.jsonl" }
CSV_DIR = { default = "/var/endoreg-service-user/lx-ai/data/import/csv" }

FRAME_PATH_REMAP_SOURCE = { default = "" }
FRAME_PATH_REMAP_TARGET = { default = "" }

DB_BACKEND = { default = "postgres" }

DJANGO_ENV = { default = "production" }
DJANGO_DEBUG = { default = "False" }
DJANGO_SETTINGS_MODULE = { default = "lx_ai.settings.settings_prod" }
DJANGO_SETTINGS_MODULE_DEVELOPMENT = { default = "lx_ai.settings.settings_dev" }
DJANGO_SETTINGS_MODULE_PRODUCTION = { default = "lx_ai.settings.settings_prod" }

DJANGO_DB_ENGINE = { default = "django.db.backends.postgresql" }
DJANGO_DB_HOST = { default = "localhost" }
DJANGO_DB_PORT = { default = "5432" }
DJANGO_DB_NAME = { default = "endoregDbLocal" }
DJANGO_DB_USER = { default = "endoregDbLocal" }
DJANGO_DB_PASSWORD_FILE = { default = "/var/endoreg-service-user/lx-ai/conf/db_pwd" }
DJANGO_DB_SSLMODE = { default = "prefer" }

LX_ANNOTATE_MASTER_KEY = { default = "" }
LX_ANNOTATE_MASTER_KEY_FILE = { default = "/etc/secrets/vault/lx_annotate_master_key" }

ENDOREG_DB_PLAINTEXT_TMP_DIR = { default = "/var/endoreg-service-user/lx-ai/data/temp/plaintext_media" }

LX_ANNOTATE_STREAMABLE_VIDEO_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos" }
LX_ANNOTATE_STREAMABLE_VIDEO_RAW_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos/raw" }
LX_ANNOTATE_STREAMABLE_VIDEO_PROCESSED_ROOT = { default = "/var/lib/lx-annotate/data/storage/streamable_videos/processed" }

LOG_LEVEL = { default = "INFO" }
