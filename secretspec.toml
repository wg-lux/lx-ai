[project]
name = "lx-ai"
revision = "1.0"

[profiles.default]
HOME_DIR = { default = "." }
WORKING_DIR = { default = "." }
DATA_DIR = { default = "data" }
CONF_DIR = { default = "conf" }

FRAME_DIR = { default = "data/frames" }

TRAINING_CONFIG_PATH = { default = "lx_ai/ai_model_config/train_sandbox_postgres.yaml" }

TRAINING_ROOT = { default = "data/model_training" }
CHECKPOINTS_DIR = { default = "data/model_training/checkpoints" }
RUNS_DIR = { default = "data/model_training/runs" }
BUCKET_SNAPSHOT_DIR = { default = "data/model_training/buckets" }

BACKBONE_CHECKPOINT = { default = "data/model_training/checkpoints/RN50_GastroNet-1M_DINOv1.pth" }

SQLITE_DB_PATH = { default = "dev_db.sqlite" }

LEGACY_IMAGE_DIR = { default = "data/legacy_images/images" }
LEGACY_JSONL_PATH = { default = "data/legacy_images/legacy_img_dicts.jsonl" }

CSV_DIR = { default = "data/import/csv" }

FRAME_PATH_REMAP_SOURCE = { default = "" }
FRAME_PATH_REMAP_TARGET = { default = "" }


DJANGO_ENV = { default = "development" }
DJANGO_DEBUG = { default = "True" }

DJANGO_SETTINGS_MODULE = { default = "lx_ai.settings.settings_dev" }
DJANGO_SETTINGS_MODULE_DEVELOPMENT = { default = "lx_ai.settings.settings_dev" }
DJANGO_SETTINGS_MODULE_PRODUCTION = { default = "lx_ai.settings.settings_prod" }

DJANGO_DB_ENGINE = { default = "django.db.backends.postgresql" }
DJANGO_DB_HOST = { default = "localhost" }
DJANGO_DB_PORT = { default = "5432" }
DJANGO_DB_NAME = { default = "endoregDbLocal" }
DJANGO_DB_USER = { default = "endoregDbLocal" }
DJANGO_DB_PASSWORD_FILE = { default = "{CONF_DIR}/db_pwd" }
DJANGO_DB_SSLMODE = { default = "prefer" }

LOG_LEVEL = { default = "INFO" }

[profiles.development]
DJANGO_ENV = { default = "development" }
DJANGO_DEBUG = { default = "True" }
DJANGO_SETTINGS_MODULE = { default = "lx_ai.settings.settings_dev" }
LOG_LEVEL = { default = "DEBUG" }
DATA_DIR = { default = "data" }
CONF_DIR = { default = "conf" }
FRAME_DIR = { default = "data/frames" }
DB_BACKEND = { default = "sqlite" }
TRAINING_CONFIG_PATH = { default = "lx_ai/ai_model_config/train_sandbox_postgres.yaml" }

TRAINING_ROOT = { default = "data/model_training" }
CHECKPOINTS_DIR = { default = "data/model_training/checkpoints" }
RUNS_DIR = { default = "data/model_training/runs" }
BUCKET_SNAPSHOT_DIR = { default = "data/model_training/buckets" }

BACKBONE_CHECKPOINT = { default = "data/model_training/checkpoints/RN50_GastroNet-1M_DINOv1.pth" }

SQLITE_DB_PATH = { default = "dev_db.sqlite" }

LEGACY_IMAGE_DIR = { default = "data/legacy_images/images" }
LEGACY_JSONL_PATH = { default = "data/legacy_images/legacy_img_dicts.jsonl" }

CSV_DIR = { default = "data/import/csv" }

FRAME_PATH_REMAP_SOURCE = { default = "/var/endoreg-service-user/lx-annotate/data/frames" }
FRAME_PATH_REMAP_TARGET = { default = "data/frames_mirror" }

[profiles.production]
DJANGO_ENV = { default = "production" }
DJANGO_DEBUG = { default = "False" }
DJANGO_SETTINGS_MODULE = { default = "lx_ai.settings.settings_prod" }
LOG_LEVEL = { default = "INFO" }
DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data" }
CONF_DIR = { default = "/var/endoreg-service-user/lx-ai/conf" }
FRAME_DIR = { default = "/var/endoreg-service-user/lx-ai/data/frames" }
DB_BACKEND = { default = "postgres" }
TRAINING_CONFIG_PATH = { default = "lx_ai/ai_model_config/train_sandbox_postgres.yaml" }

TRAINING_ROOT = { default = "/var/endoreg-service-user/lx-ai/data/model_training" }
CHECKPOINTS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints" }
RUNS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/runs" }
BUCKET_SNAPSHOT_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/buckets" }

BACKBONE_CHECKPOINT = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints/RN50_GastroNet-1M_DINOv1.pth" }

SQLITE_DB_PATH = { default = "/var/endoreg-service-user/lx-ai/dev_db.sqlite" }

LEGACY_IMAGE_DIR = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/images" }
LEGACY_JSONL_PATH = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/legacy_img_dicts.jsonl" }

CSV_DIR = { default = "/var/endoreg-service-user/lx-ai/data/import/csv" }

FRAME_PATH_REMAP_SOURCE = { default = "" }
FRAME_PATH_REMAP_TARGET = { default = "" }