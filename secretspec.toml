# =============================================================================
# Production profile
# Used by lx-ai production/service execution.
#
# Important design:
# - lx-ai writes generated frames, checkpoints, runs, and temp plaintext files
#   under /var/endoreg-service-user/lx-ai/data.
# - endoreg-db resolves protected media/videos under lx-annotate storage:
#   /var/lib/lx-annotate/data/storage.
#
# Therefore:
# - DATA_DIR remains lx-ai-owned.
# - LX_ANNOTATE_ENCRYPTED_DATA_DIR points to lx-annotate protected data root.
# - STORAGE_DIR and PROTECTED_MEDIA_ROOT point to lx-annotate protected storage.
# =============================================================================

[profiles.production]
HOME_DIR = { default = "/var/endoreg-service-user", description = "Home directory used by lx-ai." }
WORKING_DIR = { default = "/var/endoreg-service-user/lx-ai", description = "Working directory of the lx-ai project." }

DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data", description = "Main lx-ai runtime data directory." }
DJANGO_DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data", description = "Django data directory." }
LX_ANNOTATE_DATA_DIR = { default = "/var/endoreg-service-user/lx-ai/data", description = "lx-annotate data directory used by lx-ai." }
LX_ANNOTATE_ENCRYPTED_DATA_DIR = { default = "/var/lib/lx-annotate/data", description = "Protected/encrypted media data root." }

CONF_DIR = { default = "/var/endoreg-service-user/lx-ai/conf", description = "lx-ai configuration directory." }

STORAGE_DIR = { default = "/var/lib/lx-annotate/data/storage", description = "Protected media storage directory." }
PROTECTED_MEDIA_ROOT = { default = "/var/lib/lx-annotate/data/storage", description = "Protected media root used by endoreg-db." }

FRAME_DIR = { default = "/var/endoreg-service-user/lx-ai/data/frames", description = "Directory containing generated training frames." }
FRAME_MATERIALIZATION_OUTPUT_ROOT = { default = "/var/endoreg-service-user/lx-ai/data/frames/generated", description = "Output directory for materialized frames." }

TRAINING_CONFIG_PATH = { default = "/var/endoreg-service-user/lx-ai/lx_ai/ai_model_config/train_sandbox_postgres.yaml", description = "Training configuration file." }

TRAINING_ROOT = { default = "/var/endoreg-service-user/lx-ai/data/model_training", description = "Root directory for model training artifacts." }
CHECKPOINTS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints", description = "Model checkpoint directory." }
RUNS_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/runs", description = "Model training runs directory." }
BUCKET_SNAPSHOT_DIR = { default = "/var/endoreg-service-user/lx-ai/data/model_training/buckets", description = "Dataset bucket snapshot directory." }

BACKBONE_CHECKPOINT = { default = "/var/endoreg-service-user/lx-ai/data/model_training/checkpoints/RN50_GastroNet-1M_DINOv1.pth", description = "Backbone model checkpoint path." }
BACKBONE_CHECKPOINT_URL = { default = "", description = "Optional URL for downloading the backbone checkpoint." }

SQLITE_DB_PATH = { default = "/var/endoreg-service-user/lx-ai/dev_db.sqlite", description = "SQLite database path used by development." }

LEGACY_IMAGE_DIR = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/images", description = "Legacy image directory." }
LEGACY_JSONL_PATH = { default = "/var/endoreg-service-user/lx-ai/data/legacy_images/legacy_img_dicts.jsonl", description = "Legacy image metadata JSONL path." }
CSV_DIR = { default = "/var/endoreg-service-user/lx-ai/data/import/csv", description = "CSV import directory." }

FRAME_PATH_REMAP_SOURCE = { default = "", description = "Source path used for frame path remapping." }
FRAME_PATH_REMAP_TARGET = { default = "", description = "Target path used for frame path remapping." }

DB_BACKEND = { default = "postgres", description = "Database backend identifier." }

DJANGO_ENV = { default = "production", description = "Django runtime environment." }
DJANGO_DEBUG = { default = "False", description = "Whether Django debug mode is enabled." }
DJANGO_SETTINGS_MODULE = { default = "lx_ai.settings.settings_prod", description = "Primary Django settings module." }
DJANGO_SETTINGS_MODULE_DEVELOPMENT = { default = "lx_ai.settings.settings_dev", description = "Django development settings module." }
DJANGO_SETTINGS_MODULE_PRODUCTION = { default = "lx_ai.settings.settings_prod", description = "Django production settings module." }

DJANGO_DB_ENGINE = { default = "django.db.backends.postgresql", description = "Django database engine." }
DJANGO_DB_HOST = { default = "localhost", description = "Database host." }
DJANGO_DB_PORT = { default = "5432", description = "Database port." }
DJANGO_DB_NAME = { default = "endoregDbLocal", description = "Database name." }
DJANGO_DB_USER = { default = "endoregDbLocal", description = "Database user." }
DJANGO_DB_PASSWORD_FILE = { default = "/var/endoreg-service-user/lx-ai/conf/db_pwd", description = "Path to the database password file." }
DJANGO_DB_SSLMODE = { default = "prefer", description = "PostgreSQL SSL mode." }

LX_ANNOTATE_MASTER_KEY = { default = "", description = "Optional application master key." }
