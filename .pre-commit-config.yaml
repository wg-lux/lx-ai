repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=20000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: ["--fix", "lx_ai", "tests"]
        pass_filenames: false

      - id: ruff-format
        args: ["lx_ai", "tests"]
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest fast
        entry: python -m pytest -q --no-cov
        language: system
        pass_filenames: false
        stages: [manual]
